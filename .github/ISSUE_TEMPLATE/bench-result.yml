---
name: Bench result from real hardware
description: >-
  You ran docs/bench.md on a real Pi, with or without the GPS board. Tell us
  what happened. Every claim marked "verify on hardware" in the README stays
  open until somebody does this.
title: "bench: <what you tested>"
labels: ["hardware", "bench"]
body:
  - type: markdown
    attributes:
      value: |
        **Why this is worth your time.** CI never sees a Pi. The PPS GPIO
        number, the RTC overlay name, the ubxtool protocol version and the
        console rendering are all things only a bench can settle, and one
        report closes a gap for everyone. `docs/bench.md` is the checklist;
        pass 1 needs no GPS board at all.

        **What we store:** the OS image, the board revision, command output.
        Please redact your real subnets and public addresses; the placeholders
        in the README are fine to leave in.
  - type: input
    id: image
    attributes:
      label: OS image and hardware
      placeholder: Raspberry Pi OS Lite 64-bit (trixie, 2026-09-xx), Pi 4B 1 GB, Uputronics GPS/RTC HAT
    validations:
      required: true
  - type: dropdown
    id: bench_pass
    attributes:
      label: Which pass of docs/bench.md
      options:
        - Pass 1, bare Pi, no GPS board (HARDWARE_PRESENT=no)
        - Pass 2, board fitted
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mother Ticker version
      description: "`mother-ticker --version`"
      placeholder: mother-ticker 0.1.0
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: How you deployed
      options:
        - mother-ticker-install (shell, on the unit)
        - ansible-playbook from a controller
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What you saw
      description: >-
        Pass 1: the `status` block, what the console did, which checks from
        the list did not match. Pass 2: `chronyc sources -v`, `ppstest
        /dev/pps0` for a few seconds, `dmesg | grep -iE 'pps|rtc'`,
        `journalctl -u mother-ticker-gnss-config`, and what the TUI showed.
        Paste what applies.
      render: text
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: Anything you had to change to make it work
      description: A GPIO number, an overlay name, a protocol version, a package name. This is the useful part.
