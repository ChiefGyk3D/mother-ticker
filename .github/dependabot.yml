---
version: 2
updates:
  # Workflow actions are pinned to commit SHAs, which is right for supply-chain
  # reasons and means they never update on their own. Dependabot is what stops
  # "pinned" from quietly becoming "abandoned".
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # One runtime dependency (textual) and the dev toolchain.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
