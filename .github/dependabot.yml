version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # A release that turns out to be malicious is usually pulled within days;
    # waiting a week before proposing it costs nothing.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ['*']

  # Hashed lock for the deploy controller venv (scripts/setup-controller.sh)
  - package-ecosystem: pip
    directory: /ansible
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      controller-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
