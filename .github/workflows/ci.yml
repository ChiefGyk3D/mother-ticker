#
# The jobs live in ChiefGyk3D/git-your-ship-together; this file says only what
# is specific to Mother Ticker. Branch protection watches `ci / CI green`
# (ruff, mypy, bandit, pytest, the CLI smoke test, workflow lint) and
# `shell / CI green` (shellcheck, shfmt, yamllint, ansible-lint).
---
# yamllint disable rule:line-length
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@8d6d940f143b97b6d521f5dfe38b11573a916ef4 # v1.7.1
    permissions:
      contents: read
      id-token: write   # Doppler OIDC (see the shared repository's README)
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      distros: '["debian:12", "debian:13", "ubuntu:24.04"]'
      distro-runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      install-command: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
      test-command: pytest
      lint-python-version: "3.12"
      lint-install-command: pip install -e ".[dev]"
      lint-command: |
        ruff check src tests scripts
        ruff format --check src tests scripts
        bandit -c pyproject.toml -r src -q
      typecheck-install-command: pip install -e ".[dev]"
      typecheck-command: mypy
      smoke-command: mother-ticker --version
      docker-build: false
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}

  shell:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@8d6d940f143b97b6d521f5dfe38b11573a916ef4 # v1.7.1
    permissions:
      contents: read
    with:
      shfmt-args: -i 4 -ci
      config-lint-python-version: "3.12"
      config-lint-install-command: pip install "ansible-core>=2.16" ansible-lint yamllint
      config-lint-command: |
        yamllint -c .yamllint.yml .
        cd ansible && ansible-lint
        ansible-playbook -i inventory/example site.yml --syntax-check
      workflow-lint: false # python-ci already lints the workflow files
      egress-policy: block
