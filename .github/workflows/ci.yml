# CI for mother-ticker. The jobs live in ChiefGyk3D/git-your-ship-together; this file
# says only what is specific to this repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@1360d100a45897b2d658272441bc5238d6532743 # v1.16.0
    permissions:
      contents: read
      id-token: write   # Doppler OIDC (see the shared repository's README)
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      distros: '["debian:12", "debian:13", "ubuntu:24.04"]'
      distro-runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      install-command: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
      test-command: pytest
      lint-install-command: |
        pip install -e ".[dev]"
      lint-command: |
        ruff check src tests scripts
        ruff format --check src tests scripts
        mypy
        bandit -c pyproject.toml -r src -q
      smoke-command: mother-ticker --help
      docker-build: false
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}

  shell:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@1360d100a45897b2d658272441bc5238d6532743 # v1.16.0
    permissions:
      contents: read
    with:
      shfmt-args: -i 4 -ci
      # Pre-existing: shfmt would reformat six scripts the old workflow never formatted (listed in the PR).
      shfmt-continue-on-error: true
      config-lint-install-command: pip install yamllint "ansible-core>=2.16" ansible-lint
      config-lint-command: |
        # The generated callers pin by SHA and exceed the 120-column limit; actionlint and zizmor lint them.
        yamllint -d "{extends: ./.yamllint.yml, ignore: ['.venv/', 'venv/', '.github/workflows/']}" .
        (cd ansible && ansible-lint)
        (cd ansible && ansible-playbook -i inventory/example site.yml --syntax-check)
      workflow-lint: false   # the ci job above already lints the workflow files
      egress-policy: block
