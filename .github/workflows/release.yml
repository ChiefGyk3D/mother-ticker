#
# `scripts/release.sh` bumps the version, rolls the CHANGELOG and tags. The
# build, the tag/version check, the changelog check, the wheel smoke test,
# provenance, SHA256SUMS and the GitHub release live in
# ChiefGyk3D/git-your-ship-together. Not published to PyPI.
---
# yamllint disable rule:line-length
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request: # builds and checks; never publishes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-package-release.yml@8d6d940f143b97b6d521f5dfe38b11573a916ef4 # v1.7.1
    permissions:
      contents: write # the GitHub release and its assets
      id-token: write # build provenance
      attestations: write # the provenance record
    with:
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
      pypi: false
      verify-command: python3 scripts/changelog_section.py --check "$VERSION"
      smoke-command: mother-ticker --version
      release-notes-command: python3 scripts/changelog_section.py "$VERSION"
      egress-policy: block
