---
# Tag-triggered release. `scripts/release.sh` bumps the version, rolls the
# CHANGELOG and tags; this workflow refuses a tag that disagrees with either,
# builds the sdist and wheel, and creates the GitHub release with the
# CHANGELOG section as its notes.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    name: verify tag, version and changelog agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          pkg=$(python3 -c "import runpy; print(runpy.run_path('src/mother_ticker/version.py')['__version__'])")
          if [ "$version" != "$pkg" ]; then
            echo "tag $TAG does not match version.py ($pkg)" >&2
            exit 1
          fi
          python3 scripts/changelog_section.py --check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: build and publish the GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Extract release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python3 scripts/changelog_section.py "$VERSION" > release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "Mother Ticker $VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/*
