# Publishes on a version tag. The jobs live in ChiefGyk3D/git-your-ship-together.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:   # builds and checks; never publishes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-package-release.yml@0fc2df49cf51608a2f8b4b8eeb51d86d4d4cfaba # v1.27.0
    permissions:
      contents: write      # the GitHub release and its assets
      id-token: write      # PyPI Trusted Publishing, and build provenance
      attestations: write  # the provenance record
    with:
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
      pypi: false   # turn on once a Trusted Publisher on PyPI names this repository, release.yml and the pypi environment
      smoke-command: mother-ticker --help
      verify-command: python3 scripts/changelog_section.py --check "$VERSION"
      release-notes-command: python3 scripts/changelog_section.py "$VERSION"
      egress-policy: block
