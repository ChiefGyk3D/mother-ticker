#
# CodeQL (Python and the workflows), gitleaks, Semgrep, dependency review and
# OpenSSF Scorecard. The jobs live in ChiefGyk3D/git-your-ship-together.
---
# yamllint disable rule:line-length
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@8d6d940f143b97b6d521f5dfe38b11573a916ef4 # v1.7.1
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write # Scorecard publishing, and Doppler OIDC
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      codeql-queries: security-extended,security-and-quality
      # No requirements file: the one runtime dependency is tracked by
      # Dependabot and dependency review.
      pip-audit-requirements: ""
      scorecard: true
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
