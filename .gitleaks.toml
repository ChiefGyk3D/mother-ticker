# gitleaks configuration: the default rules, plus the one thing in this
# repository that looks like a key and is not.
#
# The Wazuh apt repository's signing key is pinned by its OpenPGP
# fingerprint in the role defaults. A fingerprint is the public key's hash,
# published so that it can be checked; gitleaks' generic-api-key rule cannot
# tell it from a credential. Allow that one value, nothing broader.

title = "mother-ticker"

[extend]
useDefault = true

[allowlist]
description = "Public OpenPGP key fingerprints pinned on purpose"
regexes = [
  '''0DCFCA5547B19D2A6099506096B3EE5F29111145''',
]
